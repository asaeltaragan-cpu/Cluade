services:
  - type: web
    name: sweet-automation-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WEB_ORIGIN
        value: https://asaeltaragan-cpu.github.io
      - key: AIRTABLE_TOKEN
        sync: false
      - key: AIRTABLE_BASE_ID
        value: appfu5RQfIfOJeT27
      - key: AIRTABLE_CUSTOMERS_TABLE_ID
        value: tblPPp6Op7OADlw2d
      - key: AIRTABLE_SALES_TABLE_ID
        value: tblv5NwxOib3zAUm3
      - key: CRON_SECRET
        sync: false
