name: Trigger Airtable sync

on:
  schedule:
    # GitHub does not guarantee exact timing for scheduled workflows —
    # under low repo activity this can slip by several minutes, and short
    # intervals may occasionally be skipped. This is a best-effort trigger,
    # not a real-time guarantee.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call the sync endpoint
        run: |
          set -e
          code=$(curl -s -o /tmp/body.json -w '%{http_code}' -X POST \
            "${{ vars.AIRTABLE_SYNC_URL }}/api/airtable/cron-sync" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")
          echo "HTTP $code"
          cat /tmp/body.json
          if [ "$code" -ge 300 ]; then exit 1; fi
